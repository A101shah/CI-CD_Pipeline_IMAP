name: FraudGate 2.0 — Quality Gate and Docker
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Python tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -v --cov=app --cov-report=term-missing --cov-fail-under=90

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run test
      - run: npm run build

  docker:
    name: Docker image and live health check
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fraudgate:ci
      - name: Container health check
        run: |
          docker run -d --rm --name fraudgate-ci -p 8000:8000 fraudgate:ci
          for attempt in $(seq 1 25); do
            if curl --fail --silent http://localhost:8000/health | grep -q '"status":"ok"'; then
              echo "FraudGate 2.0 Docker smoke test passed"
              exit 0
            fi
            sleep 2
          done
          docker logs fraudgate-ci
          exit 1
      - name: Clean up container
        if: always()
        run: docker rm -f fraudgate-ci || true
