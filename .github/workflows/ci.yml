name: FraudGate 2.0 — Quality Gate and Docker
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Python tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -v --cov=app --cov-report=term-missing --cov-fail-under=90

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run test
      - run: npm run build

  docker:
    name: Docker health check and GHCR publication
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fraudgate:ci
      - name: Container health check
        run: |
          docker run -d --rm --name fraudgate-ci -p 8000:8000 fraudgate:ci
          for attempt in $(seq 1 25); do
            if curl --fail --silent http://localhost:8000/health | grep -q '"status":"ok"'; then
              echo "FraudGate 2.0 Docker smoke test passed"
              exit 0
            fi
            sleep 2
          done
          docker logs fraudgate-ci
          exit 1
      - name: Clean up container
        if: always()
        run: docker rm -f fraudgate-ci || true

      # Only publish trusted main-branch builds AFTER the smoke test succeeds.
      # A pull request (including from a fork) only builds and tests; it never publishes.
      - name: Authenticate to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified Docker image to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/a101shah/fraudgate"
          VERSION="sha-${GITHUB_SHA:0:12}"

          # Publish exactly the image that the health check exercised.
          docker tag fraudgate:ci "${IMAGE}:${VERSION}"
          docker tag fraudgate:ci "${IMAGE}:latest"
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"

          # Check that GHCR now exposes the published commit-specific manifest.
          docker buildx imagetools inspect "${IMAGE}:${VERSION}" > /dev/null
          {
            echo "### Docker image published successfully"
            echo ""
            echo "- **Commit tag:** \`${IMAGE}:${VERSION}\`"
            echo "- **Floating tag:** \`${IMAGE}:latest\`"
            echo "- **Source commit:** \`${GITHUB_SHA}\`"
            echo "- **Registry:** GitHub Container Registry (GHCR)"
            echo ""
            echo "The tested container image is stored in GitHub Packages."
          } >> "${GITHUB_STEP_SUMMARY}"

      # Optional: after the tested image is published, redeploy a Render image service.
      # The hook URL contains a secret key; it is never stored in source code or logged.
      - name: Trigger cloud Docker deployment (optional Render hook)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_DEPLOY_HOOK_URL}" ]]; then
            echo "Render hook not configured; Docker image is published and ready to deploy."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 20 --request POST \
            "${RENDER_DEPLOY_HOOK_URL}" > /dev/null
          echo "Render deployment requested after successful image publication." >> "${GITHUB_STEP_SUMMARY}"
