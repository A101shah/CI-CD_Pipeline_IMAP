name: FraudGate CI - Test and Docker Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Automated tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: python -m pytest -v --cov=app --cov-report=term-missing --cov-fail-under=90
  docker-build:
    name: Docker build and container smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: fraudgate:ci
      - name: Start container and check health
        run: |
          docker run -d --rm --name fraudgate-ci -p 8000:8000 fraudgate:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8000/health | grep -q '"status":"ok"'; then
              echo "Container smoke test passed"
              exit 0
            fi
            sleep 2
          done
          docker logs fraudgate-ci
          exit 1
      - name: Clean up container
        if: always()
        run: docker rm -f fraudgate-ci || true
