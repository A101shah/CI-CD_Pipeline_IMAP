name: Pawly - Test, Publish Docker, Deploy Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pawly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Test and build Pawly
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run deterministic feature tests
        run: npm test
      - name: Build production React website
        run: npm run build
      - name: Upload Pages artifact for main pushes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  docker:
    name: Build, smoke-test and publish a new image
    needs: frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pawly:ci
          build-args: |
            PAWLY_BUILD_RUN=${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify actual running container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name pawly-ci -p 8080:8080 pawly:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health | grep -qx 'ok' && \
               curl -fsS http://localhost:8080/ | grep -q 'Pawly'; then
              echo 'Pawly Docker smoke test passed.'
              exit 0
            fi
            sleep 2
          done
          docker logs pawly-ci
          exit 1
      - name: Remove smoke-test container
        if: always()
        run: docker rm -f pawly-ci || true

      # Every successful push, on any branch, publishes an immutable commit-specific tag.
      # Pull requests test/build but never publish an image.
      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image to GitHub Packages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          FULL_SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')/pawly"
          SHORT_SHA="${FULL_SHA:0:12}"
          RUN_TAG="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag pawly:ci "$IMAGE:$RUN_TAG"
          docker push "$IMAGE:$RUN_TAG"
          docker tag pawly:ci "$IMAGE:sha-$SHORT_SHA"
          docker push "$IMAGE:sha-$SHORT_SHA"
          if [[ "$GIT_REF" == 'refs/heads/main' ]]; then
            docker tag pawly:ci "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
          docker buildx imagetools inspect "$IMAGE:$RUN_TAG" >/dev/null
          {
            echo '### Pawly Docker package published'
            echo ''
            echo "- **New version:** \`$IMAGE:$RUN_TAG\`"
            echo "- **Commit alias:** \`$IMAGE:sha-$SHORT_SHA\`"
            echo "- **Source commit:** \`$FULL_SHA\`"
            echo '- **Registry:** GitHub Container Registry'
            echo "- **Browse packages:** https://github.com/${GITHUB_REPOSITORY_OWNER}?tab=packages"
            echo ''
            echo 'The exact container tested above is now available as a versioned package.'
          } >> "$GITHUB_STEP_SUMMARY"

  pages:
    name: Deploy verified app to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy previously tested frontend artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Deployment summary
        run: |
          echo '### Pawly website deployed' >> "$GITHUB_STEP_SUMMARY"
          echo "Live website: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
