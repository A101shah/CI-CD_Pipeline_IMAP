name: Deploy FraudGate to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fraudgate-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Test, build, and publish dashboard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run frontend tests
        run: npm run test
      - name: Build GitHub Pages static release
        env:
          VITE_STATIC_MODE: "true"
        run: npm run build -- --base=/CI-CD_Pipeline_IMAP/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
